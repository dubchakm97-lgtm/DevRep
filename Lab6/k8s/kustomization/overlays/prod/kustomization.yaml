apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flask-prod

resources:
  - ../../base

patches:
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi
